name: BTC weekly backtest

on:
  schedule:
    # Sundays 12:00 UTC. Kept small (--days 2) on purpose: this shares the
    # same free-tier Gemini quota as the live-analysis cron (20 deep-model
    # calls/day). Live already uses ~18/day, so a bigger backtest here would
    # push that day over the cap and fail a live run. --days 2 adds 4 calls
    # (22/day total) — safe headroom is thin by design, not an oversight.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Historical days to backtest"
        type: number
        default: 2

concurrency:
  group: btc-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: BTC backtest + trend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run backtest
        env:
          TRADINGAGENTS_LLM_PROVIDER: google
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.5-flash
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.1-flash-lite
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python scripts/backtest_btc.py
          --days ${{ inputs.days || 2 }}
          --horizons 1,3,7
          --history-file .state/backtest_history.jsonl
      - name: Summarize trend across runs
        run: |
          python scripts/analyze_backtest_history.py --history-file .state/backtest_history.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit updated backtest history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -d .state ] && git add .state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: append BTC backtest history [skip ci]"
            git pull --rebase origin main
            git push
          fi
