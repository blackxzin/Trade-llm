name: BTC live analysis

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Post to Discord even if the decision is unchanged"
        type: boolean
        default: false

concurrency:
  group: btc-analysis
  cancel-in-progress: false

jobs:
  run:
    name: BTC-USD live decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      # Runners are ephemeral — persist the notify-dedup state file across
      # runs via cache, otherwise every run starts with no history and
      # notifies on every fire regardless of --heartbeat-hours.
      - name: Restore notify-state cache
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: btc-notify-state-${{ github.run_id }}
          restore-keys: |
            btc-notify-state-
      - name: Run BTC live analysis
        env:
          TRADINGAGENTS_LLM_PROVIDER: nvidia
          TRADINGAGENTS_DEEP_THINK_LLM: deepseek-ai/deepseek-r1
          TRADINGAGENTS_QUICK_THINK_LLM: meta/llama-3.3-70b-instruct
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_2: ${{ secrets.NVIDIA_API_KEY_2 }}
          NVIDIA_API_KEY_3: ${{ secrets.NVIDIA_API_KEY_3 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python scripts/run_btc_analysis.py --votes 3
          --state-file .state/btc_notify_state.json
          ${{ inputs.force_notify && '--force-notify' || '' }}
      - name: Save notify-state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: btc-notify-state-${{ github.run_id }}
