name: BTC live analysis

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Post to Discord even if the decision is unchanged"
        type: boolean
        default: false

concurrency:
  group: btc-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    name: BTC-USD live decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run BTC live analysis
        env:
          TRADINGAGENTS_LLM_PROVIDER: google
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.5-flash
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.1-flash-lite
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: >
          python scripts/run_btc_analysis.py --votes 3
          --state-file .state/btc_notify_state.json
          ${{ inputs.force_notify && '--force-notify' || '' }}
      # Commit the notify-dedup state straight to the repo instead of relying
      # solely on actions/cache — a GitHub Actions cache entry is evicted
      # after 7 days without access, so if the cron itself stopped firing for
      # a week the dedup state would silently reset. A committed file has no
      # such expiry and every run starts from exactly what the last run left.
      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update BTC notify-state [skip ci]"
            git pull --rebase origin main
            git push
          fi
